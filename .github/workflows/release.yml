# Publishes a release when a new version reaches main:
#
#   bundle exec rake version:set[0.3.2]   # + rename "## Unreleased" to "## 0.3.2" in CHANGELOG.md
#   bundle install
#   git commit -am "Release 0.3.2" && git push
#
# The push changes gems/gemstack/lib/gemstack/version.rb, which starts this
# workflow. It checks the version, the changelog and the tree, runs the tests,
# pushes the gems that aren't on rubygems.org yet, then creates the v0.3.2 tag
# and the GitHub release. Pushing a v* tag by hand (or "Run workflow" in the
# Actions tab) does the same; every step skips what already exists, so a run
# can be repeated safely.
#
# Gems are pushed with rubygems.org trusted publishing (no API key or MFA code
# is stored anywhere). Each gem must have gemstack-rb/gemstack, this workflow
# and the "release" environment registered as a trusted publisher on
# rubygems.org. The "release" environment should require an approval, so
# nothing is published until a maintainer approves the run.
name: Release

on:
  push:
    branches: [main]
    paths: ["gems/gemstack/lib/gemstack/version.rb"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # the tag and the GitHub release
  id-token: write   # trusted publishing to rubygems.org

# One release at a time; a second run waits instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # existing tags
      - name: Database client libraries (pg, mysql2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: The version to release
        id: version
        run: |
          version=$(ruby -e 'require "./gems/gemstack/lib/gemstack/version"; print GemStack::VERSION')
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME but the code is $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing GemStack $version"

      - name: Which gems still need publishing
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          script/published --missing > pending.txt
          cat pending.txt
          echo "any=$([ -s pending.txt ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          released=$(gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1 && echo true || echo false)
          echo "released=$released" >> "$GITHUB_OUTPUT"

      - name: Already released
        if: steps.pending.outputs.any == 'false' && steps.pending.outputs.released == 'true'
        run: echo "GemStack ${{ steps.version.outputs.version }} is already published and released; nothing to do."

      - name: The changelog has this version
        if: steps.pending.outputs.any == 'true' || steps.pending.outputs.released == 'false'
        run: |
          grep -q "^## ${{ steps.version.outputs.version }}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section"; exit 1; }

      - name: Nothing that looks like a secret or data file is tracked
        if: steps.pending.outputs.any == 'true'
        run: script/check-secret-files

      - name: Tests (SQLite) and build
        if: steps.pending.outputs.any == 'true'
        run: |
          bundle exec rake test test:databases
          bundle exec rake gems:check

      - uses: rubygems/configure-rubygems-credentials@v1.0.0
        if: steps.pending.outputs.any == 'true'

      - name: Publish to rubygems.org
        if: steps.pending.outputs.any == 'true'
        run: |
          while read -r gem version; do gem push "pkg/$gem-$version.gem"; done < pending.txt

      - name: Tag
        if: steps.pending.outputs.released == 'false'
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA" && git push origin "$tag"
          fi

      - name: GitHub release with the changelog section
        if: steps.pending.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.version }}"
          ruby -e 'v = ARGV[0]; s = File.read("CHANGELOG.md"); puts s[/^## #{Regexp.escape(v)}\n(.*?)(?=^## |\z)/m, 1].to_s.strip' "$version" > notes.md
          gh release create "${{ steps.version.outputs.tag }}" --verify-tag --title "GemStack $version" --notes-file notes.md
