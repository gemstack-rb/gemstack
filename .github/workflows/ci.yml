# Tests on every push to main and every pull request: the whole suite on each
# supported Ruby, the database suites on SQLite, PostgreSQL and MySQL, and one
# end-to-end run (generate an app, its tests, TypeScript, next build).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4", "4.0"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot" --health-interval 3s --health-retries 40
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      GEMSTACK_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/gemstack_test
      GEMSTACK_TEST_MYSQL_URL: mysql2://root:root@127.0.0.1:3306/gemstack_test
      GEMSTACK_TEST_REDIS_URL: redis://127.0.0.1:6379/1
    steps:
      - uses: actions/checkout@v4
      - name: Database client libraries (pg, mysql2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev default-libmysqlclient-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: No secret or data files are tracked
        run: script/check-secret-files
      - name: Tests, database suites and RuboCop
        run: bundle exec rake

  e2e:
    name: End to end (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Database client libraries (pg, mysql2)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev default-libmysqlclient-dev
      # Gems are installed system-wide, as on a developer machine: bin/gemstack
      # runs without Bundler, and the generated app must not see a vendor/bundle
      # that only this repository's bundle knows about.
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
      - name: Install gems
        run: bundle install --jobs 4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate an app, run its tests, TypeScript and next build
        run: script/e2e
